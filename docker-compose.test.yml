services:
  postgres-test:
    image: postgres:16-alpine
    container_name: agentbench-db-test
    environment:
      POSTGRES_DB: agentbench_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - ./runner/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentbench-test-network
    tmpfs:
      - /var/lib/postgresql/data

networks:
  agentbench-test-network:
    driver: bridge
