services:
  postgres:
    image: postgres:16-alpine
    container_name: agentbench-db
    environment:
      POSTGRES_DB: agentbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./runner/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./runner/db/init-password.sh:/docker-entrypoint-initdb.d/02-init-password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentbench-network

volumes:
  postgres_data:
    driver: local

networks:
  agentbench-network:
    driver: bridge
